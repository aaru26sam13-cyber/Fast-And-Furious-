name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Termux Files
        run: |
          rm -f local.properties app/local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i '/aapt2/d' gradle.properties || true
          sed -i '/termux/d' gradle.properties || true
          sed -i '/\/data\/data/d' gradle.properties || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fast-And-Furious-APK
          path: app/build/outputs/apk/debug/*.apk
